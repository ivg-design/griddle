[package]
name = "griddle"
version = "1.0.3"
description = "Griddle — floating panel that authors snappable grid guides in the Rive editor via its MCP server"
authors = ["IVG Design"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
strip = true
lto = true
