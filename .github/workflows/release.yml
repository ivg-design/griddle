name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Griddle v__VERSION__"
          releaseBody: |
            Griddle — a floating panel that authors snappable grid guides in the Rive editor via its MCP server. Deterministic: no agent, no AI.

            14 grid types: rectangular, dot (dash-ready / crosses), baseline, brick, isometric, triangular, diamond, hexagonal, polar, 1-point & 2-point perspective, golden ratio, rule of thirds, layout columns.

            Requires the Rive editor running with a file open (MCP server on 127.0.0.1:9791).

            macOS builds are unsigned — right-click → Open on first launch, or run: xattr -dr com.apple.quarantine /Applications/Griddle.app
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
